<!DOCTYPE html>
<html lang="az">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Lessons</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <h2>📚 Lessons</h2>

    <div class="lesson-selector">
      <select id="lesson-select" class="btn">
        <option value="" disabled selected>Dərs seçin</option>
      </select>
    </div>
    <div id="card-container">
      <div id="word-card" class="card">
        <div class="card-inner">
          <div class="card-front">
            <strong id="card-word">Word</strong>
            <small id="card-pronunciation-az" style="opacity: 0.7; display: block; margin-top: 10px;"></small>
            <br>
            <em id="card-example">"Example"</em>
          </div>
          <div class="card-back">
            <strong id="card-meaning">Meaning</strong>
            <br>
            <em id="card-example-az">"Nümunə"</em>
            <!-- Bildim düyməsi -->
            <button id="learned-btn" class="nav-btn" style="margin-top: 20px; display: none;">✅ Bildim</button>
          </div>
        </div>
      </div>
    </div>

    <div id="card-nav">
      <button id="next-btn" class="nav-btn">➡</button>
      <button id="prev-btn" class="nav-btn">⬅</button>
      <button id="shuffle-btn" class="nav-btn">Qarışdırmaq</button>
      <button id="unknown-btn" class="nav-btn">❓ Bilmedim</button>
      <button id="reverse-btn" class="nav-btn">🔄 Çevir</button>
      <button id="unknown-lesson-btn" class="nav-btn">📚 Bilmediklərim</button>
    </div>

    <br>
    <a href="index.html" class="btn">⬅ Back</a>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
